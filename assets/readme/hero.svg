<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Arca：macOS 压缩与解压，拖进去、看清楚、开始。">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0b10"/>
      <stop offset="1" stop-color="#0d1018"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#6d6df8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#6d6df8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.86" cy="0.85" r="0.55">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b8bff"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="440" fill="url(#bg)"/>
  <rect width="1200" height="440" fill="url(#grid)"/>
  <rect width="1200" height="440" fill="url(#glowA)"/>
  <rect width="1200" height="440" fill="url(#glowB)"/>

  <!-- wordmark -->
  <text x="72" y="150" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
        font-size="76" font-weight="700" letter-spacing="-1.5" fill="#f4f5f9">Arca</text>
  <text x="74" y="196" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
        font-size="23" fill="#a9b0c3">macOS 上的压缩与解压：拖进去，看清楚，再开始。</text>
  <text x="74" y="232" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
        font-size="16" fill="#7f879b">原生窗口与 WKWebView · 内置 7-Zip 26.05 / zstd 1.5.7 / par2 1.4.0</text>

  <!-- chips -->
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
     font-size="14" font-weight="600" fill="#dfe3ee">
    <rect x="74" y="262" width="66" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="91" y="283">7Z</text>
    <rect x="150" y="262" width="72" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="164" y="283">ZIP</text>
    <rect x="232" y="262" width="112" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="246" y="283">TAR.ZST</text>
    <rect x="354" y="262" width="118" height="32" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="368" y="283" fill="#9aa2b6">RAR · 只读</text>
  </g>

  <!-- right: file → box → archive -->
  <g transform="translate(706 124) scale(0.76)">
    <!-- files -->
    <g stroke="#8b8bff" stroke-opacity="0.75" stroke-width="1.6" fill="#141826">
      <rect x="0" y="66" width="86" height="104" rx="10" transform="rotate(-8 43 118)"/>
      <rect x="18" y="46" width="86" height="104" rx="10" transform="rotate(-3 61 98)"/>
      <rect x="40" y="26" width="86" height="104" rx="10"/>
    </g>
    <g fill="#8b8bff" fill-opacity="0.55">
      <rect x="54" y="48" width="58" height="6" rx="3"/>
      <rect x="54" y="64" width="40" height="6" rx="3"/>
    </g>

    <!-- arrow -->
    <path d="M148 78h58" stroke="url(#stroke)" stroke-width="2" stroke-linecap="round"/>
    <path d="M198 72l10 6-10 6" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- box -->
    <g transform="translate(222 18)">
      <rect x="0" y="26" width="128" height="86" rx="12" fill="#161a29" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.6"/>
      <rect x="-6" y="10" width="140" height="24" rx="9" fill="#1d2333" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.6"/>
      <path d="M18 54h92" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M18 68h64" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="108" cy="88" r="13" fill="#6d6df8" fill-opacity="0.22"/>
      <path d="M102 88l4 4 8-9" fill="none" stroke="#b9b9ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- arrow -->
    <path d="M368 78h52" stroke="url(#stroke)" stroke-width="2" stroke-linecap="round"/>
    <path d="M412 72l10 6-10 6" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- archive result -->
    <g transform="translate(430 28)">
      <rect x="0" y="0" width="216" height="76" rx="14" fill="#161a29" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.6"/>
      <text x="18" y="32" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
            font-size="15" font-weight="600" fill="#eef0f6">photos.7z</text>
      <text x="18" y="55" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
            font-size="12" fill="#8d95a9">246 MB · 3 卷 · PAR2 +5%</text>
    </g>
  </g>

  <!-- footer line -->
  <line x1="72" y1="356" x2="1128" y2="356" stroke="#ffffff" stroke-opacity="0.08"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
     font-size="14" fill="#7f879b">
    <text x="72" y="388">全程本机完成，文件不上传</text>
    <text x="470" y="388">AES-256 · 分卷 · PAR2 恢复记录</text>
    <text x="880" y="388">Finder 右键 · 默认打开方式 · 自更新</text>
  </g>
</svg>
