<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">Arca — macOS 上的压缩与解压</title>
  <desc id="desc">左侧是项目名与一句话说明：拖进去、看清楚、再开始；右侧是一条真实的处理流程：文件经归档箱得到带分卷与 PAR2 恢复记录的 7z 归档。</desc>

  <defs>
    <linearGradient id="depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0d14"/>
      <stop offset="1" stop-color="#080910"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="18" fill="url(#depth)"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="64" y="148" font-size="80" font-weight="700" letter-spacing="-1.5" fill="#f4f5f9">Arca</text>
    <text x="66" y="196" font-size="26" fill="#b3b9c9">拖进去，看清楚，再开始。</text>
    <text x="66" y="232" font-size="19" fill="#8d94a6">macOS 原生 · 内置 7-Zip 26.05 / zstd 1.5.7 / par2 1.4.0</text>

    <g font-size="19" font-weight="600" fill="#e3e6ef">
      <rect x="66" y="266" width="78" height="38" rx="19" fill="#ffffff" fill-opacity="0.07"/>
      <text x="88" y="291">7Z</text>
      <rect x="154" y="266" width="84" height="38" rx="19" fill="#ffffff" fill-opacity="0.07"/>
      <text x="172" y="291">ZIP</text>
      <rect x="248" y="266" width="128" height="38" rx="19" fill="#ffffff" fill-opacity="0.07"/>
      <text x="266" y="291">TAR.ZST</text>
      <rect x="386" y="266" width="132" height="38" rx="19" fill="#ffffff" fill-opacity="0.05"/>
      <text x="404" y="291" fill="#a6adbf">RAR · 只读</text>
    </g>
  </g>

  <g id="project-proof" transform="translate(700 100) scale(0.78)">
    <g id="inputs" stroke="#8b8bff" stroke-opacity="0.8" stroke-width="2" fill="#12151f">
      <rect x="0" y="52" width="84" height="104" rx="10" transform="rotate(-9 42 104)"/>
      <rect x="16" y="34" width="84" height="104" rx="10" transform="rotate(-3 58 86)"/>
      <rect x="36" y="16" width="84" height="104" rx="10"/>
    </g>
    <g id="inputs-lines" fill="#8b8bff" fill-opacity="0.5">
      <rect x="50" y="38" width="56" height="7" rx="3.5"/>
      <rect x="50" y="56" width="38" height="7" rx="3.5"/>
    </g>

    <g id="flow-in">
      <path d="M136 68h44" stroke="#7c83f0" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M174 61l9 7-9 7" fill="none" stroke="#7c83f0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g id="archive-box" transform="translate(200 8)">
      <rect x="0" y="24" width="126" height="88" rx="12" fill="#161a25" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
      <rect x="-7" y="8" width="140" height="26" rx="10" fill="#1d2230" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
      <path d="M18 54h90" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" stroke-linecap="round"/>
      <path d="M18 70h62" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2" stroke-linecap="round"/>
      <circle cx="106" cy="88" r="14" fill="#6d6df8" fill-opacity="0.28"/>
      <path d="M99 88l5 5 9-10" fill="none" stroke="#c7c7ff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g id="flow-out">
      <path d="M336 68h40" stroke="#4bb8f0" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M370 61l9 7-9 7" fill="none" stroke="#4bb8f0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g id="result" transform="translate(392 22)">
      <rect x="0" y="0" width="204" height="96" rx="14" fill="#161a25" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
      <text x="18" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="20" font-weight="650" fill="#eef0f6">photos.7z</text>
      <text x="18" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" fill="#9aa2b6">246 MB · 3 卷</text>
      <text x="18" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" fill="#7c83f0">PAR2 +5%</text>
    </g>
  </g>

  <g id="footnote" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
     font-size="18" fill="#878fa3">
    <line x1="64" y1="336" x2="1136" y2="336" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="64" y="376">全程本机完成，文件不上传</text>
    <text x="446" y="376">AES-256 · 分卷 · PAR2 恢复记录</text>
    <text x="852" y="376">Finder 右键 · 自更新</text>
  </g>
</svg>
