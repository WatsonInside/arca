<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140"
     role="img" aria-labelledby="title desc">
  <title id="title">01 装一个，右键就能用</title>
  <desc id="desc">下载 DMG、拖进 Applications，然后从 Finder 右键或默认打开方式进入。</desc>
  <rect width="1200" height="140" rx="16" fill="#0b0d14"/>
  <text x="56" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
        font-size="54" font-weight="800" fill="#7c83f0">01</text>
  <text x="136" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
        font-size="44" font-weight="650" fill="#f2f4f9">装一个，右键就能用</text>
  <text x="136" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
        font-size="20" fill="#8d94a6">下载 DMG、拖进 Applications，然后从 Finder 右键或默认打开方式进入。</text>
  <line x1="56" y1="122" x2="1144" y2="122" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
