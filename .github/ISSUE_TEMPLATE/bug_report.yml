name: Bug 报告
description: 报告 Arca 的功能或行为问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先确认：已运行 `build/venv/bin/python -S -E scripts/all_test.py`
        且与你问题相关的套件是通过的（若失败请附输出原文，这本身就是有效信息）。
  - type: dropdown
    id: area
    attributes:
      label: 问题区域
      options:
        - 解压
        - 压缩
        - 引擎 / 组件更新
        - 界面 / 交互
        - 钥匙串 / 密码
        - Finder 集成
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开…
        2. 选择…
        3. 点击…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果（含完整错误文案）
      description: 请附任务卡 / Toast 上的原始错误文字，不要转述
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Arca 版本
      placeholder: "1.0.0（页脚可见）"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 版本与机型
      placeholder: "macOS 15.x · MacBook Pro M3"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充材料
      description: 归档格式 / 大小 / 是否加密 / 分卷等（不要上传涉密文件本身）
